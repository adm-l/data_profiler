name: Build Master PDF
on:
  push:
    paths:
      - 'docs/Go_Data_Profiler_Master_Copy.md'
      - 'scripts/build_master_pdf.py'
      - '.github/workflows/build-master-pdf.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python scripts/build_master_pdf.py
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Go_Data_Profiler_Master_Copy.pdf
          git diff --cached --quiet && exit 0
          git commit -m "docs: add Go Data Profiler master technical PDF"
          git push
