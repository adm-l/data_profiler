apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-profiler
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
  - host: profiler.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: data-profiler, port: {number: 80}}}
