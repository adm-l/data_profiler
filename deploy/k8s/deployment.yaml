apiVersion: apps/v1
kind: Deployment
metadata: {name: data-profiler}
spec:
  replicas: 2
  selector: {matchLabels: {app: data-profiler}}
  template:
    metadata: {labels: {app: data-profiler}}
    spec:
      containers:
      - name: api
        image: YOUR_ECR_REPOSITORY/data-profiler:latest
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: data-profiler-config}}, {secretRef: {name: data-profiler-secret}}]
        readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: data-profiler}
spec:
  selector: {app: data-profiler}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: data-profiler}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: data-profiler}
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
